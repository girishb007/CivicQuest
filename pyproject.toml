[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "civicquest"
version = "0.1.0"
description = "Guest-first civic participation for Mumbai"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "geoalchemy2>=0.15,<1", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4",
  "redis>=5,<7", "boto3>=1.35,<2", "pillow>=11,<13", "pillow-heif>=0.20,<2",
  "imagehash>=4.3,<5", "httpx>=0.27,<1", "authlib>=1.4,<2", "pywebpush>=2,<3",
  "pydantic-settings>=2.6,<3", "python-multipart>=0.0.18,<1", "shapely>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "moto[s3,sqs]>=5,<6"]

[project.scripts]
civicquest = "civicquest.cli:main"

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["apps/api"]
markers = ["integration: requires real PostgreSQL/PostGIS", "live: requires explicit external credentials"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

